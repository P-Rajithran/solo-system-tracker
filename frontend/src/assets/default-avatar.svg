<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0a1526"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="200" height="200" fill="url(#bgGrad)"/>
  <circle cx="100" cy="100" r="94" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="8 4" opacity="0.6"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>

  <!-- Geometric Accents -->
  <polygon points="100,8 108,20 92,20" fill="#38bdf8" opacity="0.9"/>
  <polygon points="100,192 108,180 92,180" fill="#38bdf8" opacity="0.9"/>
  <polygon points="8,100 20,108 20,92" fill="#38bdf8" opacity="0.9"/>
  <polygon points="192,100 180,108 180,92" fill="#38bdf8" opacity="0.9"/>

  <!-- Shadow Hunter Silhouette Hood & Shoulders -->
  <path d="M40 180 C40 145 65 125 80 120 C70 110 65 95 65 80 C65 55 80 35 100 35 C120 35 135 55 135 80 C135 95 130 110 120 120 C135 125 160 145 160 180 Z" fill="#0f1f38" stroke="#0284c7" stroke-width="2"/>

  <!-- Face Shadow & Mask -->
  <path d="M78 75 Q100 95 122 75 Q100 115 78 75 Z" fill="#030712"/>

  <!-- Glowing Monarch Hunter Eyes -->
  <polygon points="82,82 94,84 88,88" fill="#38bdf8" filter="url(#glow)"/>
  <polygon points="118,82 106,84 112,88" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="88" cy="85" r="2" fill="#ffffff"/>
  <circle cx="112" cy="85" r="2" fill="#ffffff"/>

  <!-- Chest Energy Core Accent -->
  <polygon points="100,135 108,148 100,160 92,148" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
</svg>
